<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백엔드 로그인 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        triplog: {
                            50: "#e8fafb",
                            100: "#d0f4f6",
                            500: "#10b6c0",
                            600: "#087f89"
                        },
                        google: "#4285f4",
                        naver: "#03c75a"
                    },
                    fontFamily: {
                        sans: ["Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "system-ui", "sans-serif"],
                        mono: ["JetBrains Mono", "Cascadia Mono", "Consolas", "monospace"]
                    },
                    keyframes: {
                        panelIn: {
                            "0%": {opacity: "0", transform: "translateY(10px)"},
                            "100%": {opacity: "1", transform: "translateY(0)"}
                        }
                    },
                    animation: {
                        panelIn: "panelIn 180ms ease-out"
                    }
                }
            },
            safelist: [
                "border-google/35",
                "bg-[#f6f9ff]",
                "border-emerald-300",
                "bg-emerald-50",
                "border-triplog-500/35",
                "bg-triplog-50"
            ]
        };
    </script>
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_12%_0%,rgba(16,182,192,0.14),transparent_28%),linear-gradient(180deg,#fff_0%,#f4fbfc_100%)] text-slate-950">
<main class="mx-auto w-[min(1180px,calc(100%_-_36px))] py-8">
    <header class="mb-5 flex items-center justify-between gap-5 max-md:block">
        <div class="flex items-center gap-4">
            <img class="block h-[58px] w-[58px] object-contain" src="/images/triplog-logo.png" alt="Triplog">
            <div>
                <h1 class="m-0 text-[28px] font-black tracking-normal max-sm:text-[23px]">백엔드 로그인 테스트</h1>
                <p class="mt-1 text-sm font-medium text-slate-500">프론트 없이 백엔드 인증 API 흐름을 확인합니다.</p>
            </div>
        </div>
        <span class="inline-flex min-h-9 items-center rounded-full border border-triplog-500/30 bg-white px-3 text-[13px] font-black text-triplog-600 max-md:mt-3">
            POST /auth/oauth
        </span>
    </header>

    <div class="grid grid-cols-[330px_1fr] gap-5 max-md:grid-cols-1">
        <aside class="rounded-lg border border-slate-200 bg-white/95 p-3.5 shadow-[0_18px_44px_rgba(22,32,51,0.08)]">
            <button type="button" class="provider-button group grid min-h-[84px] w-full grid-cols-[48px_1fr_auto] items-center gap-3 rounded-lg border border-google/35 bg-[#f6f9ff] p-3 text-left transition duration-200 hover:-translate-y-0.5 hover:shadow-lg" data-provider="google">
                <span class="grid h-12 w-12 place-items-center rounded-xl bg-google text-xl font-black text-white shadow-[0_8px_18px_rgba(66,133,244,0.18)]">G</span>
                <span>
                    <span class="block text-[15px] font-black">Google</span>
                    <span class="mt-1 block text-xs font-medium leading-snug text-slate-500">구글 로그인</span>
                </span>
                <span class="inline-flex h-6 items-center rounded-full bg-triplog-100 px-2.5 text-xs font-black text-triplog-600">구현</span>
            </button>

            <button type="button" class="provider-button group mt-2.5 grid min-h-[84px] w-full grid-cols-[48px_1fr_auto] items-center gap-3 rounded-lg border border-transparent bg-transparent p-3 text-left transition duration-200 hover:-translate-y-0.5 hover:bg-emerald-50 hover:shadow-lg" data-provider="naver">
                <span class="grid h-12 w-12 place-items-center rounded-xl bg-naver text-xl font-black text-white">N</span>
                <span>
                    <span class="block text-[15px] font-black">Naver</span>
                    <span class="mt-1 block text-xs font-medium leading-snug text-slate-500">네이버 로그인</span>
                </span>
                <span class="inline-flex h-6 items-center rounded-full bg-triplog-100 px-2.5 text-xs font-black text-triplog-600">구현</span>
            </button>

            <button type="button" class="provider-button group mt-2.5 grid min-h-[84px] w-full grid-cols-[48px_1fr_auto] items-center gap-3 rounded-lg border border-transparent bg-transparent p-3 text-left transition duration-200 hover:-translate-y-0.5 hover:bg-triplog-50 hover:shadow-lg" data-provider="local">
                <span class="grid h-12 w-12 place-items-center rounded-xl bg-triplog-500 text-xl font-black text-white">L</span>
                <span>
                    <span class="block text-[15px] font-black">Local</span>
                    <span class="mt-1 block text-xs font-medium leading-snug text-slate-500">우리 서비스 로그인</span>
                </span>
                <span class="inline-flex h-6 items-center rounded-full bg-triplog-100 px-2.5 text-xs font-black text-triplog-600">구현</span>
            </button>
        </aside>

        <section class="rounded-lg border border-slate-200 bg-white/95 p-6 shadow-[0_18px_44px_rgba(22,32,51,0.08)] max-sm:p-4">
            <div class="panel animate-panelIn" data-panel="google">
                <div class="mb-5 flex items-start justify-between gap-4 border-b border-slate-200 pb-5 max-md:block">
                    <div class="flex items-center gap-3">
                        <span class="grid h-[46px] w-[46px] place-items-center rounded-xl bg-google text-xl font-black text-white shadow-[0_8px_18px_rgba(66,133,244,0.18)]">G</span>
                        <div>
                            <h2 class="m-0 text-[22px] font-black tracking-normal">Google Login</h2>
                            <p class="mt-1.5 text-[13px] font-medium leading-normal text-slate-500">구글 로그인</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 max-md:mt-3">
                        <span class="inline-flex min-h-7 items-center rounded-full bg-blue-50 px-2.5 text-xs font-black text-blue-700">provider GOOGLE</span>
                        <span class="inline-flex min-h-7 items-center rounded-full bg-blue-50 px-2.5 text-xs font-black text-blue-700">Authorization Code</span>
                    </div>
                </div>

                <div class="grid gap-3.5">
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="googleRedirectUri">Redirect URI</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="googleRedirectUri" th:value="${googleRedirectUri}" readonly>
                    </div>
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="googleCode">Authorization Code</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="googleCode" th:value="${provider == 'google' ? code : ''}" placeholder="Google 로그인 후 자동 입력됩니다.">
                    </div>
                </div>

                <div class="mt-5 flex flex-wrap gap-2.5">
                    <button type="button" class="h-[42px] rounded-md border border-google bg-google px-4 text-sm font-black text-white shadow-[0_10px_22px_rgba(66,133,244,0.18)] transition hover:-translate-y-0.5 hover:shadow-xl" id="googleLoginButton">Google Login</button>
                    <button type="button" class="h-[42px] rounded-md bg-triplog-50 px-4 text-sm font-black text-triplog-600 transition hover:-translate-y-0.5 hover:bg-triplog-100" id="requestGoogleButton">Request Login API</button>
                    <button type="button" class="h-[42px] rounded-md bg-slate-100 px-4 text-sm font-black text-slate-950 transition hover:-translate-y-0.5 hover:bg-slate-200" id="clearButton">Clear</button>
                </div>
            </div>

            <div class="panel hidden animate-panelIn" data-panel="naver">
                <div class="mb-5 flex items-start justify-between gap-4 border-b border-slate-200 pb-5 max-md:block">
                    <div class="flex items-center gap-3">
                        <span class="grid h-[46px] w-[46px] place-items-center rounded-xl bg-naver text-xl font-black text-white">N</span>
                        <div>
                            <h2 class="m-0 text-[22px] font-black tracking-normal">Naver Login</h2>
                            <p class="mt-1.5 text-[13px] font-medium leading-normal text-slate-500">네이버 로그인</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 max-md:mt-3">
                        <span class="inline-flex min-h-7 items-center rounded-full bg-emerald-50 px-2.5 text-xs font-black text-emerald-700">provider NAVER</span>
                        <span class="inline-flex min-h-7 items-center rounded-full bg-emerald-50 px-2.5 text-xs font-black text-emerald-700">Authorization Code</span>
                    </div>
                </div>

                <div class="grid gap-3.5">
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="naverRedirectUri">Redirect URI</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="naverRedirectUri" th:value="${naverRedirectUri}" readonly>
                    </div>
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="naverCode">Authorization Code</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="naverCode" th:value="${provider == 'naver' ? code : ''}" placeholder="Naver 로그인 후 자동 입력됩니다.">
                    </div>
                </div>

                <div class="mt-5 flex flex-wrap gap-2.5">
                    <button type="button" class="h-[42px] rounded-md bg-naver px-4 text-sm font-black text-white shadow-[0_10px_22px_rgba(3,199,90,0.18)] transition hover:-translate-y-0.5 hover:shadow-xl" id="naverLoginButton">Naver Login</button>
                    <button type="button" class="h-[42px] rounded-md bg-triplog-50 px-4 text-sm font-black text-triplog-600 transition hover:-translate-y-0.5 hover:bg-triplog-100" id="requestNaverButton">Request Login API</button>
                </div>
            </div>

            <div class="panel hidden animate-panelIn" data-panel="local">
                <div class="mb-5 flex items-start justify-between gap-4 border-b border-slate-200 pb-5 max-md:block">
                    <div class="flex items-center gap-3">
                        <span class="grid h-[46px] w-[46px] place-items-center rounded-xl bg-triplog-500 text-xl font-black text-white">L</span>
                        <div>
                            <h2 class="m-0 text-[22px] font-black tracking-normal">Local Login</h2>
                            <p class="mt-1.5 text-[13px] font-medium leading-normal text-slate-500">우리 서비스 로그인</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap justify-end gap-2 max-md:mt-3">
                        <span class="inline-flex min-h-7 items-center rounded-full bg-triplog-50 px-2.5 text-xs font-black text-triplog-600">provider LOCAL</span>
                        <span class="inline-flex min-h-7 items-center rounded-full bg-triplog-50 px-2.5 text-xs font-black text-triplog-600">Email Password</span>
                    </div>
                </div>

                <div class="grid gap-3.5">
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="localEmail">Email</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="localEmail" placeholder="test@test.com">
                    </div>
                    <div>
                        <label class="mb-1.5 block text-[13px] font-black text-slate-500" for="localPassword">Password</label>
                        <input class="h-[42px] w-full rounded-md border border-slate-300 bg-slate-50 px-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="localPassword" type="password" placeholder="원문 비밀번호">
                    </div>
                </div>

                <div class="mt-5 flex flex-wrap gap-2.5">
                    <button type="button" class="h-[42px] rounded-md bg-triplog-500 px-4 text-sm font-black text-white shadow-[0_10px_22px_rgba(16,182,192,0.18)] transition hover:-translate-y-0.5 hover:shadow-xl" id="requestLocalButton">Request Login API</button>
                </div>
            </div>

            <p class="min-h-[22px] py-4 text-[13px] font-semibold text-slate-500" id="message"></p>
            <div class="mb-2.5 text-[15px] font-black">Response</div>
            <textarea class="min-h-[250px] w-full resize-y rounded-md border border-slate-300 bg-slate-50 p-3 font-mono text-[13px] text-slate-950 outline-none transition focus:border-triplog-500 focus:ring-2 focus:ring-triplog-500/20" id="result" readonly></textarea>
        </section>
    </div>
</main>

<input type="hidden" id="googleClientIdValue" th:value="${googleClientId}">
<input type="hidden" id="googleRedirectUriValue" th:value="${googleRedirectUri}">
<input type="hidden" id="naverClientIdValue" th:value="${naverClientId}">
<input type="hidden" id="naverRedirectUriValue" th:value="${naverRedirectUri}">
<input type="hidden" id="initialCodeValue" th:value="${code}">
<input type="hidden" id="initialProviderValue" th:value="${provider}">

<script>
    const googleClientId = document.getElementById("googleClientIdValue").value;
    const googleRedirectUri = document.getElementById("googleRedirectUriValue").value;
    const naverClientId = document.getElementById("naverClientIdValue").value;
    const naverRedirectUri = document.getElementById("naverRedirectUriValue").value;
    const initialCode = document.getElementById("initialCodeValue").value;
    const initialProvider = document.getElementById("initialProviderValue").value || "google";
    const googleCode = document.getElementById("googleCode");
    const naverCode = document.getElementById("naverCode");
    const localEmail = document.getElementById("localEmail");
    const localPassword = document.getElementById("localPassword");
    const result = document.getElementById("result");
    const message = document.getElementById("message");
    const activeClasses = {
        google: ["border-google/35", "bg-[#f6f9ff]"],
        naver: ["border-emerald-300", "bg-emerald-50"],
        local: ["border-triplog-500/35", "bg-triplog-50"]
    };

    function setMessage(text, type) {
        message.textContent = text;
        message.className = "min-h-[22px] py-4 text-[13px] font-semibold";
        if (type === "success") {
            message.classList.add("text-emerald-700");
            return;
        }
        if (type === "error") {
            message.classList.add("text-red-600");
            return;
        }
        message.classList.add("text-slate-500");
    }

    function writeResult(value) {
        result.value = JSON.stringify(value, null, 2);
    }

    function clearSharedState() {
        result.value = "";
        setMessage("", "");
    }

    function setActiveProvider(provider) {
        document.querySelectorAll(".provider-button").forEach((button) => {
            button.classList.remove("border-google/35", "bg-[#f6f9ff]", "border-emerald-300", "bg-emerald-50", "border-triplog-500/35", "bg-triplog-50");
            button.classList.add("border-transparent", "bg-transparent");
        });

        document.querySelectorAll(".panel").forEach((panel) => {
            panel.classList.add("hidden");
        });

        const activeButton = document.querySelector(`[data-provider="${provider}"]`);
        activeButton.classList.remove("border-transparent", "bg-transparent");
        activeButton.classList.add(...activeClasses[provider]);

        const activePanel = document.querySelector(`[data-panel="${provider}"]`);
        activePanel.classList.remove("hidden");
        activePanel.classList.remove("animate-panelIn");
        requestAnimationFrame(() => activePanel.classList.add("animate-panelIn"));
    }

    document.querySelectorAll(".provider-button").forEach((button) => {
        button.addEventListener("click", () => {
            setActiveProvider(button.dataset.provider);
            clearSharedState();
        });
    });

    document.getElementById("googleLoginButton").addEventListener("click", () => {
        const params = new URLSearchParams({
            client_id: googleClientId,
            redirect_uri: googleRedirectUri,
            response_type: "code",
            scope: "openid email",
            prompt: "consent"
        });

        window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
    });

    document.getElementById("requestGoogleButton").addEventListener("click", async () => {
        const code = googleCode.value.trim();

        if (!code) {
            setMessage("Authorization Code가 필요합니다.", "error");
            return;
        }

        setMessage("Google 로그인 API 요청 중입니다.", "");

        const response = await fetch("/auth/oauth", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                provider: "GOOGLE",
                code
            })
        });

        const body = await response.json();
        writeResult({
            status: response.status,
            body
        });
        setMessage("Google 로그인 API 응답을 받았습니다.", response.ok ? "success" : "error");
    });

    document.getElementById("naverLoginButton").addEventListener("click", () => {
        const state = crypto.randomUUID();
        sessionStorage.setItem("naverOAuthState", state);

        const params = new URLSearchParams({
            response_type: "code",
            client_id: naverClientId,
            redirect_uri: naverRedirectUri,
            state
        });

        window.location.href = `https://nid.naver.com/oauth2.0/authorize?${params}`;
    });

    document.getElementById("requestNaverButton").addEventListener("click", async () => {
        const code = naverCode.value.trim();
        const state = sessionStorage.getItem("naverOAuthState") || "";

        if (!code) {
            setMessage("Authorization Code가 필요합니다.", "error");
            return;
        }

        setMessage("Naver 로그인 API 요청 중입니다.", "");

        const response = await fetch("/auth/oauth", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                provider: "NAVER",
                code,
                state
            })
        });

        const body = await response.json();
        writeResult({
            status: response.status,
            body
        });
        setMessage("Naver 로그인 API 응답을 받았습니다.", response.ok ? "success" : "error");
    });


    document.getElementById("requestLocalButton").addEventListener("click", async () => {
        const email = localEmail.value.trim();
        const password = localPassword.value;

        if (!email) {
            setMessage("Email이 필요합니다.", "error");
            return;
        }

        if (!password) {
            setMessage("Password가 필요합니다.", "error");
            return;
        }

        setMessage("Local 로그인 API 요청 중입니다.", "");

        const response = await fetch("/auth/oauth", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                provider: "LOCAL",
                email,
                password
            })
        });

        const body = await response.json();
        writeResult({
            status: response.status,
            body
        });
        setMessage("Local 로그인 API 응답을 받았습니다.", response.ok ? "success" : "error");
    });

    document.getElementById("clearButton").addEventListener("click", () => {
        googleCode.value = "";
        naverCode.value = "";
        localEmail.value = "";
        localPassword.value = "";
        clearSharedState();
    });


    setActiveProvider(initialProvider);

    if (initialCode) {
        writeResult({code: initialCode});
        setMessage("Authorization Code가 전달되었습니다. Request Login API를 실행하세요.", "success");
    }
</script>
</body>
</html>
