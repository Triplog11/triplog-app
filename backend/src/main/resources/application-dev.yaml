spring:
  # [애플리케이션 기본 설정]
  application:
    name: ${SPRING_APPLICATION_NAME:back} # Spring Boot 애플리케이션 이름

  # [Multipart 설정]: 이미지 업로드 파일 및 전체 요청 크기 제한
  servlet:
    multipart:
      max-file-size: ${IMAGE_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${IMAGE_UPLOAD_MAX_REQUEST_SIZE:101MB}

  # [JPA & Hibernate 설정]: 엔티티와 DB 테이블 매핑 및 SQL 출력 설정
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate} # Flyway 스키마와 엔티티 매핑 일치 여부 검증
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true} # SQL을 보기 좋게 정렬하여 출력
        show_sql: ${HIBERNATE_SHOW_SQL:true} # 실행되는 SQL 로그 출력
        default_batch_fetch_size: ${HIBERNATE_DEFAULT_BATCH_FETCH_SIZE:100} # N+1 문제 완화를 위한 배치 페치 사이즈 설정

  # [Database 연동]: MySQL 메인 DB 접속 정보
  datasource:
    url: ${DB_URL} # MySQL DB 접속 URL
    username: ${DB_USERNAME} # MySQL 접속 계정
    password: ${DB_PASSWORD} # MySQL 접속 비밀번호

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}

  batch:
    job:
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}
      name: ${SPRING_BATCH_JOB_NAME:regionSyncJob}
    jdbc:
      initialize-schema: ${SPRING_BATCH_JDBC_INITIALIZE_SCHEMA:never}

  # [Redis 설정]: 캐싱, 세션, 토큰 관리 등에 사용할 Redis 서버 연결 정보
  data:
    redis:
      host: ${REDIS_HOST:localhost} # Redis 서버 주소
      port: ${REDIS_PORT:6379} # Redis 기본 포트

# [SpringDoc/Swagger]: API 문서화 도구 설정
springdoc:
  swagger-ui:
    path: ${SWAGGER_UI_PATH:/swagger-ui.html} # Swagger UI 접속 경로
  api-docs:
    path: ${API_DOCS_PATH:/v3/api-docs} # OpenAPI 문서 JSON 경로

# [로깅 설정]: 애플리케이션 로그 출력 레벨 설정
logging:
  level:
    root: ${LOG_LEVEL:info} # 전체 애플리케이션 로그 레벨 설정

# [jwt 토큰 설정]: jwt 토큰 키값, 유효시간 설정
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY}

# [Social Login - Naver]: 네이버 OAuth2 API 키 정보
naver:
  client_id: ${NAVER_CLIENT_ID}
  redirect_uri: ${NAVER_REDIRECT_URI}
  client_secret: ${NAVER_CLIENT_SECRET}

# [Social Login - Google]: 구글 OAuth2 API 키 정보
google:
  client_id: ${GOOGLE_CLIENT_ID}
  redirect_uri: ${GOOGLE_REDIRECT_URI}
  client_secret: ${GOOGLE_CLIENT_SECRET}

# [TourAPI]: 한국관광공사 국문 관광정보 서비스 연동 설정
tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  service-key: ${TOUR_API_SERVICE_KEY:}
  mobile-os: ${TOUR_API_MOBILE_OS:ETC}
  mobile-app: ${TOUR_API_MOBILE_APP:Triplog}
  connect-timeout: ${TOUR_API_CONNECT_TIMEOUT:3s}
  read-timeout: ${TOUR_API_READ_TIMEOUT:10s}
  retry:
    max-retries: ${TOUR_API_RETRY_MAX_RETRIES:3}
    delays: ${TOUR_API_RETRY_DELAYS:1s,2s,4s}

# [TourAPI 동기화]: 수집 범위와 자동 실행 설정
tourism-sync:
  festival:
    past-days: ${TOURISM_SYNC_FESTIVAL_PAST_DAYS:30}
    future-months: ${TOURISM_SYNC_FESTIVAL_FUTURE_MONTHS:12}
  missing-threshold: ${TOURISM_SYNC_MISSING_THRESHOLD:3}
  landmark-seed-path: ${TOURISM_SYNC_LANDMARK_SEED_PATH:classpath:seed/landmarks.csv}
  scheduling:
    enabled: ${TOURISM_SYNC_SCHEDULING_ENABLED:false}
    region-cron: "${TOURISM_SYNC_REGION_CRON:0 0 3 1 * *}"
    landmark-cron: "${TOURISM_SYNC_LANDMARK_CRON:0 30 3 * * *}"
    festival-cron: "${TOURISM_SYNC_FESTIVAL_CRON:0 0 4 * * *}"
    failure-retry-cron: "${TOURISM_SYNC_FAILURE_RETRY_CRON:0 30 4 * * *}"
    zone: "${TOURISM_SYNC_SCHEDULING_ZONE:Asia/Seoul}"

# [이미지 업로드 - Cloudinary]: Cloudinary 키 정보
cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME}
  api:
    key: ${CLOUDINARY_API_KEY}
    secret: ${CLOUDINARY_API_SECRET}
  upload:
    allowed-content-types: ${IMAGE_UPLOAD_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/heic,image/heif}
    jpeg-conversion-content-types: ${IMAGE_UPLOAD_JPEG_CONVERSION_CONTENT_TYPES:image/heic,image/heif}
    max-file-count: ${IMAGE_UPLOAD_MAX_FILE_COUNT:10}
