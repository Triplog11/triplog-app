plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'triplog'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	// Spring Boot
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// Spring Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Database / JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// CSV
	implementation 'org.apache.commons:commons-csv:1.14.1'

	// Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	// Swagger / OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

	// Cloudinary
	implementation 'com.cloudinary:cloudinary-http5:2.0.0'

	// Firebase Cloud Messaging
	implementation 'com.google.firebase:firebase-admin:9.7.0'

	// Prometheus
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.charSet = 'UTF-8'
	options.docEncoding = 'UTF-8'
}

import org.springframework.boot.gradle.tasks.bundling.BootJar

tasks.register('tourismBatch', JavaExec) {
	group = 'application'
	description = '웹 서버 없이 지정한 TourAPI Spring Batch Job을 실행합니다.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'triplog.backend.TourismBatchApplication'
}

tasks.register('tourismBatchJar', BootJar) {
	group = 'build'
	description = 'TourAPI Batch 전용 실행 JAR을 생성합니다.'
	archiveClassifier = 'batch'
	mainClass = 'triplog.backend.TourismBatchApplication'
	classpath = sourceSets.main.runtimeClasspath
	targetJavaVersion = JavaVersion.VERSION_21
}
