name: TourAPI 배치 수동 실행

on:
  workflow_dispatch:
    inputs:
      job:
        description: 실행할 TourAPI Batch Job
        required: true
        type: choice
        default: selectedContentSyncJob
        options:
          - regionSyncJob
          - selectedContentSyncJob
          - festivalSyncJob
          - tourismSyncFailureRetryJob
      selected_content_mode:
        description: 선정 랜드마크·관광지 실행 모드
        required: false
        type: choice
        default: INCREMENTAL
        options:
          - INITIAL
          - INCREMENTAL
      base_date:
        description: 하루치 축제 조회 기준일(YYYY-MM-DD, 비우면 서버 기준 오늘)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: tourism-batch
  cancel-in-progress: false

jobs:
  run-tourism-batch:
    name: ${{ inputs.job }} 실행
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 배포 서버에서 TourAPI Batch 실행
        uses: appleboy/ssh-action@v1.0.3
        env:
          BATCH_JOB: ${{ inputs.job }}
          SELECTED_CONTENT_MODE: ${{ inputs.selected_content_mode }}
          FESTIVAL_BASE_DATE: ${{ inputs.base_date }}
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          envs: BATCH_JOB,SELECTED_CONTENT_MODE,FESTIVAL_BASE_DATE
          command_timeout: 60m
          script: |
            set -euo pipefail
            cd /home/g100dndudvkr/triplog

            if [ ! -f ./triplog-tourism-batch.jar ]; then
              echo "Batch JAR이 없습니다. 백엔드 배포 워크플로를 먼저 실행하세요."
              exit 1
            fi

            if [ ! -f ./.env ]; then
              echo "서버 환경변수 파일이 없습니다."
              exit 1
            fi

            exec 9>/tmp/triplog-tourism-batch.lock
            if ! flock -n 9; then
              echo "다른 TourAPI Batch Job이 이미 실행 중입니다."
              exit 1
            fi

            set -a
            . ./.env
            set +a

            REQUESTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            BATCH_ARGS=(
              "--spring.batch.job.name=$BATCH_JOB"
              "requestedAt=$REQUESTED_AT"
            )

            case "$BATCH_JOB" in
              regionSyncJob|tourismSyncFailureRetryJob)
                ;;
              selectedContentSyncJob)
                case "$SELECTED_CONTENT_MODE" in
                  INITIAL|INCREMENTAL)
                    BATCH_ARGS+=("mode=$SELECTED_CONTENT_MODE")
                    ;;
                  *)
                    echo "지원하지 않는 선정 콘텐츠 실행 모드입니다: $SELECTED_CONTENT_MODE"
                    exit 1
                    ;;
                esac
                ;;
              festivalSyncJob)
                if [ -z "${FESTIVAL_BASE_DATE:-}" ]; then
                  FESTIVAL_BASE_DATE=$(date +%Y-%m-%d)
                fi
                if ! [[ "$FESTIVAL_BASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                  echo "축제 기준일은 YYYY-MM-DD 형식이어야 합니다."
                  exit 1
                fi
                export TOURISM_SYNC_FESTIVAL_PAST_DAYS=0
                export TOURISM_SYNC_FESTIVAL_FUTURE_MONTHS=0
                BATCH_ARGS+=("baseDate=$FESTIVAL_BASE_DATE")
                ;;
              *)
                echo "지원하지 않는 Batch Job입니다: $BATCH_JOB"
                exit 1
                ;;
            esac

            java -jar ./triplog-tourism-batch.jar "${BATCH_ARGS[@]}"
