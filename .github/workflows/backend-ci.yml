  name: 백엔드 ci

  on:
    pull_request:
      branches:
        - develop
    push:
      branches:
        - develop

  permissions:
    contents: read
    pull-requests: read

  jobs:
    changes:
      runs-on: ubuntu-latest
      outputs:
        backend: ${{ steps.filter.outputs.backend }}
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: 바뀐 파일 확인
          id: filter
          uses: dorny/paths-filter@v3
          with:
            base: develop
            filters: |
              backend:
                - 'backend/**'
                - '.github/workflows/backend-ci.yml'

    backend-test:
      needs: changes
      if: ${{ needs.changes.outputs.backend == 'true' }}
      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: backend

      services:
        mysql:
          image: mysql:8.0
          env:
            MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE_TEST }}
            MYSQL_USER: ${{ secrets.DB_USERNAME_TEST }}
            MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD_TEST }}
            MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD_TEST }}
          ports:
            - 3306:3306
          options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p${{ secrets.MYSQL_ROOT_PASSWORD_TEST }}"
            --health-interval=10s
            --health-timeout=5s
            --health-retries=5
        redis:
          image: redis:7-alpine
          ports:
            - 6379:6379
          options: >-
            --health-cmd "redis-cli ping"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - uses: actions/checkout@v4

        - name: jdk 17 설정
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 17

        - name: gradle 설정
          uses: gradle/actions/setup-gradle@v4

        - name: gradlew 권한 부여
          run: chmod +x ./gradlew

        - name: 테스트
          run: ./gradlew test
          env:
            SPRING_PROFILES_ACTIVE: test-dev
            DB_URL_TEST: ${{ secrets.DB_URL_TEST }}
            DB_USERNAME_TEST: ${{ secrets.DB_USERNAME_TEST }}
            DB_PASSWORD_TEST: ${{ secrets.DB_PASSWORD_TEST }}
            REDIS_HOST: localhost
            REDIS_PORT: 6379
            JPA_DDL_AUTO: create-drop

        - name: 빌드
          run: ./gradlew build -x test
          env:
            SPRING_PROFILES_ACTIVE: dev
            DB_URL: ${{ secrets.DB_URL }}
            DB_USERNAME: ${{ secrets.DB_USERNAME }}
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
            REDIS_HOST: localhost
            REDIS_PORT: 6379