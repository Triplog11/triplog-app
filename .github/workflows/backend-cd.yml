name: 백엔드 빌드 및 배포

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  backend-build:
    name: 백엔드 빌드 실행
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 백엔드 빌드
        run: ./gradlew clean build -x test

      - name: 배포용 JAR 이름 변경
        run: |
          mkdir -p deploy
          cp $(find build/libs -name "*.jar" ! -name "*-plain.jar") deploy/triplog-backend.jar

      - name: JAR 파일 서버 업로드
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: backend/deploy/triplog-backend.jar
          target: /home/g100dndudvkr/triplog
          strip_components: 2

      - name: 서버 환경변수 생성 및 애플리케이션 재시작
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PORT: ${{ secrets.REDIS_PORT }}
          JPA_DDL_AUTO: update
          HIBERNATE_FORMAT_SQL: true
          HIBERNATE_SHOW_SQL: true
          HIBERNATE_DEFAULT_BATCH_FETCH_SIZE: 100
          LOG_LEVEL: info
          SWAGGER_UI_PATH: /swagger-ui.html
          API_DOCS_PATH: /v3/api-docs
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_VALIDITY: ${{ secrets.JWT_ACCESS_TOKEN_VALIDITY }}
          JWT_REFRESH_TOKEN_VALIDITY: ${{ secrets.JWT_REFRESH_TOKEN_VALIDITY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USERNAME }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          envs: SPRING_PROFILES_ACTIVE,DB_URL,DB_USERNAME,DB_PASSWORD,REDIS_HOST,REDIS_PORT,JPA_DDL_AUTO,HIBERNATE_FORMAT_SQL,HIBERNATE_SHOW_SQL,HIBERNATE_DEFAULT_BATCH_FETCH_SIZE,LOG_LEVEL,SWAGGER_UI_PATH,API_DOCS_PATH,JWT_SECRET,JWT_ACCESS_TOKEN_VALIDITY,JWT_REFRESH_TOKEN_VALIDITY,NAVER_CLIENT_ID,NAVER_REDIRECT_URI,NAVER_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_REDIRECT_URI,GOOGLE_CLIENT_SECRET
          script: |
            mkdir -p /home/g100dndudvkr/triplog

            cat > /home/g100dndudvkr/triplog/.env <<EOF
            SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE
            DB_URL=$DB_URL
            DB_USERNAME=$DB_USERNAME
            DB_PASSWORD=$DB_PASSWORD
            REDIS_HOST=$REDIS_HOST
            REDIS_PORT=$REDIS_PORT
            JPA_DDL_AUTO=$JPA_DDL_AUTO
            HIBERNATE_FORMAT_SQL=$HIBERNATE_FORMAT_SQL
            HIBERNATE_SHOW_SQL=$HIBERNATE_SHOW_SQL
            HIBERNATE_DEFAULT_BATCH_FETCH_SIZE=$HIBERNATE_DEFAULT_BATCH_FETCH_SIZE
            LOG_LEVEL=$LOG_LEVEL
            SWAGGER_UI_PATH=$SWAGGER_UI_PATH
            API_DOCS_PATH=$API_DOCS_PATH
            JWT_SECRET=$JWT_SECRET
            JWT_ACCESS_TOKEN_VALIDITY=$JWT_ACCESS_TOKEN_VALIDITY
            JWT_REFRESH_TOKEN_VALIDITY=$JWT_REFRESH_TOKEN_VALIDITY
            NAVER_CLIENT_ID=$NAVER_CLIENT_ID
            NAVER_REDIRECT_URI=$NAVER_REDIRECT_URI
            NAVER_CLIENT_SECRET=$NAVER_CLIENT_SECRET
            GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
            GOOGLE_REDIRECT_URI=$GOOGLE_REDIRECT_URI
            GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
            EOF

            sudo -n /usr/bin/systemctl restart triplog
            sudo -n /usr/bin/systemctl is-active --quiet triplog